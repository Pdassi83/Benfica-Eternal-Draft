name: Apply v1.4.1 polish

on:
  push:
    branches:
      - agent/ranking-placement-v1.4.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ranking-placement-v1.4.1
          fetch-depth: 0

      - name: Patch gameplay and final celebration
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global page
              if old not in page:
                  raise SystemExit(f'Missing expected block: {label}')
              page = page.replace(old, new, 1)

          replace_once(
              'const seededRandom=(seed:number):Random=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};',
              'const seededRandom=(seed:number):Random=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};\nconst FEATURED_IDS=["eusebio","aimar","jonas"];\nconst shuffled=<T,>(items:T[],rng:Random)=>{const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};',
              'random helpers',
          )

          replace_once(
              'function ChampionCard({result,coach,onShare,shareStatus,mode,dailyKey}:{result:Result;coach:Coach;onShare:()=>void;shareStatus:string;mode:GameMode;dailyKey:string}){',
              'function ChampionCard({result,coach,picks,formation,onShare,shareStatus,mode,dailyKey}:{result:Result;coach:Coach;picks:Pick[];formation:Formation;onShare:()=>void;shareStatus:string;mode:GameMode;dailyKey:string}){',
              'ChampionCard signature',
          )

          replace_once(
              '   <p><span>Treinador</span><b>{coach.name}</b></p>\n   <div className="champion-scorers">',
              '   <p><span>Treinador</span><b>{coach.name}</b></p>\n   <div className="champion-squad"><span>Onze campeão · {formation}</span><ol>{picks.map((pick,index)=><li key={pick.player.id}><i>{String(index+1).padStart(2,"0")}</i><b>{pick.player.name}</b><small>{pick.slot}</small></li>)}</ol></div>\n   <div className="champion-scorers">',
              'champion squad',
          )

          replace_once(
              ' const[packSeed,setPackSeed]=useState(0);\n const[route,setRoute]=useState<Rival[]>(()=>rivals.slice(0,6));',
              ' const[packSeed,setPackSeed]=useState(0);\n const[draftSeed,setDraftSeed]=useState(1);\n const[route,setRoute]=useState<Rival[]>(()=>rivals.slice(0,6));',
              'draft seed state',
          )

          replace_once(
              ' const candidates=useMemo(()=>slot?players.filter(p=>!picks.some(x=>x.player.id===p.id)&&compat(p,slot)).sort((a,b)=>mode==="daily"?seedHash(`${dailyKey}:${picks.length}:${packSeed}:${a.id}`)-seedHash(`${dailyKey}:${picks.length}:${packSeed}:${b.id}`):((hash(a.id)*(picks.length+7+packSeed*13))%997)-((hash(b.id)*(picks.length+7+packSeed*13))%997)).slice(0,4):[],[slot,picks,packSeed,mode,dailyKey]);',
              ' const candidates=useMemo(()=>{if(!slot)return[];const pool=players.filter(p=>!picks.some(x=>x.player.id===p.id)&&compat(p,slot)),seed=mode==="daily"?seedHash(`${dailyKey}:${picks.length}:${packSeed}`):seedHash(`${draftSeed}:${picks.length}:${packSeed}`),selected=shuffled(pool,seededRandom(seed)).slice(0,4);if(mode==="classic"){const featuredId=FEATURED_IDS[draftSeed%FEATURED_IDS.length],featured=pool.find(p=>p.id===featuredId),firstEligible=featured?formations[formation].findIndex(s=>compat(featured,s)):-1;if(featured&&picks.length===firstEligible&&!selected.some(p=>p.id===featured.id))selected[selected.length-1]=featured}return selected},[slot,picks,packSeed,mode,dailyKey,draftSeed,formation]);',
              'candidate selection',
          )

          replace_once(
              ' const start=()=>{resetDraft();setMode("classic");setRoute(drawRoute());setView("draft")};',
              ' const start=()=>{resetDraft();const seed=seedHash(`${Date.now()}:${Math.random()}`);setDraftSeed(seed);setMode("classic");setRoute(drawRoute(seededRandom(seed)));setView("draft")};',
              'classic start',
          )

          replace_once(
              '<ChampionCard result={results.at(-1)!} coach={coach} onShare=',
              '<ChampionCard result={results.at(-1)!} coach={coach} picks={picks} formation={formation} onShare=',
              'ChampionCard call',
          )

          page_path.write_text(page)

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          marker = '/* v1.4.1 — sorteio justo, formações legíveis e plantel campeão */'
          if marker not in css:
              css += '''\n\n/* v1.4.1 — sorteio justo, formações legíveis e plantel campeão */
.formations b{font-size:24px;line-height:1}.formations small{font-size:8px;line-height:1.35}.formations small em{font-size:7px}
.champion-squad{padding:15px 0;border-bottom:1px solid #ffffff1d}.champion-squad>span{display:block;margin-bottom:9px;color:#aaa39a;font:6px var(--mono);letter-spacing:.07em;text-transform:uppercase}.champion-squad ol{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0;padding:0;list-style:none}.champion-squad li{display:grid;grid-template-columns:28px minmax(0,1fr) 25px;align-items:center;min-width:0;border:1px solid #ffffff16;background:#ffffff08}.champion-squad li i{display:grid;height:100%;min-height:34px;place-items:center;background:#c9a44c;color:#171613;font:700 6px var(--mono);font-style:normal}.champion-squad li b{overflow:hidden;padding:7px 8px;color:#f4ecdf;font:12px var(--serif);text-overflow:ellipsis;white-space:nowrap}.champion-squad li small{padding-right:7px;color:#d1ad51;font:6px var(--mono);text-align:right}
@media(min-width:1100px){.end.champion{display:grid;grid-template-columns:180px minmax(0,1fr);column-gap:22px;align-items:start}.end.champion .trophy{grid-column:1;grid-row:1/5;width:180px;height:250px;margin:38px auto 0}.end.champion .champion-card{grid-column:2;margin:0}.end.champion .score-submit-host,.end.champion .restart-link{grid-column:2}}
@media(max-width:760px){.formations b{font-size:22px}.formations small{font-size:7.5px}.formations small em{font-size:6.5px}.champion-squad ol{grid-template-columns:1fr}.champion-squad li b{font-size:13px}}
'''
          css_path.write_text(css)

          workflow = Path('.github/workflows/apply-v141-polish.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Melhora sorteio, formações e cartão campeão"
          git push origin HEAD:agent/ranking-placement-v1.4.1
